{% extends "base.html" %}
{% import "macros.html" as ui %}

{% block main_class %}page{% endblock %}

{% block content %}
<section class="panel panel--raised" aria-labelledby="notfound-heading">
  <div class="panel__body stack">
    <span class="chip-label">404</span>
    <h1 id="notfound-heading">That page is not on the trail</h1>
    <p class="lede">{{ message }}</p>
    <div class="row-actions">
      <a class="btn btn--primary" href="/">Back to the trail map</a>
      {% if user and user.is_curator %}<a class="btn" href="/curator">Open the curator studio</a>{% endif %}
    </div>
  </div>
</section>
{% endblock %}
